name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Windows / Python 3.11
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"

      - name: Install test environment
        run: uv sync --extra test

      - name: Run Python tests
        run: uv run pytest -q

      - name: Run browser tests
        run: node --test tests/test_web_ui.cjs tests/test_web_dom.cjs tests/test_web_theme.cjs

      - name: Build distributions
        run: uv build

      - name: Install wheel in a clean environment and run the command
        run: uv run --isolated --no-project --with ./dist/codeaway-0.1.0-py3-none-any.whl codeaway --help
